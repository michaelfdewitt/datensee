# Release on tag push: `git tag v<version> && git push origin v<version>`.
#
#   1. verify   — the tag matches cli/pyproject.toml (the single source of
#                 truth for the version), unit tests pass, wheel + sdist build.
#   2. jar      — Gradle shadowJar, attached to the GitHub Release as
#                 datensee-pipeline.jar (what `datensee jar download` fetches).
#   3. pypi     — `uv publish` via PyPI Trusted Publishing (OIDC; no token).
#
# One-time setup (see docs/releasing.md):
#   - PyPI: add a Trusted Publisher for this repo/workflow/environment `pypi`.
#   - GitHub: create the `pypi` environment (optionally with required reviewers).
#   - Stage the Flex Template first: scripts/release-template.sh <version>.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Resolve version from pyproject and check the tag
        id: version
        working-directory: cli
        run: |
          version="$(uv version --short)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - name: Unit tests
        working-directory: cli
        run: |
          uv sync
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest -q
      - name: Build wheel and sdist
        working-directory: cli
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cli/dist/
          if-no-files-found: error

  jar:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build shadow JAR
        working-directory: pipelines
        run: ./gradlew --no-daemon shadowJar
      - name: Attach JAR to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --generate-notes \
                 $([[ "$TAG" == *a* || "$TAG" == *b* || "$TAG" == *rc* ]] && echo --prerelease)
          gh release upload "$TAG" pipelines/build/libs/datensee-pipeline.jar --clobber

  pypi:
    runs-on: ubuntu-latest
    needs: [verify, jar]
    environment:
      name: pypi
      url: https://pypi.org/project/datensee/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish dist/*
