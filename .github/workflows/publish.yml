# Release on tag push: `git tag v<version> && git push origin v<version>`.
#
#   1. verify   — the tag matches cli/pyproject.toml (the single source of
#                 truth for the version), unit tests pass, wheel + sdist build.
#   2. jar      — downloads the bucket-staged JAR, verifies it against the
#                 digest pinned in _jar_digest.py, attaches it to the GitHub
#                 Release (what `datensee jar download` fetches).
#   3. pypi     — `uv publish` via PyPI Trusted Publishing (OIDC; no token).
#
# One-time setup (see docs/releasing.md):
#   - PyPI: add a Trusted Publisher for this repo/workflow/environment `pypi`.
#   - GitHub: create the `pypi` environment (optionally with required reviewers).
#   - Stage the Flex Template first: scripts/release-template.sh <version>.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Resolve version from pyproject and check the tag
        id: version
        working-directory: cli
        run: |
          version="$(uv version --short)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - name: Unit tests
        working-directory: cli
        run: |
          uv sync
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest -q
      - name: Build wheel and sdist
        working-directory: cli
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cli/dist/
          if-no-files-found: error

  jar:
    # Mirror-and-verify, not rebuild: the release JAR is built exactly once
    # by the template-staging step, which uploads it to the public bucket and
    # commits its sha256 into cli/src/datensee/_jar_digest.py. This job
    # downloads that artifact, verifies it against the committed pin, and
    # attaches the identical bytes to the GitHub Release — so bucket, release
    # asset, and wheel pin can never disagree. It also fails the release
    # loudly when the template was never staged for this version.
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the staged JAR and verify the committed digest pin
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          pinned=$(sed -nE 's/^JAR_SHA256: str \| None = "([0-9a-f]{64})"$/\1/p' \
                     cli/src/datensee/_jar_digest.py)
          if [[ -z "$pinned" ]]; then
            echo "::error::cli/src/datensee/_jar_digest.py carries no pinned digest —" \
                 "run scripts/release-template.sh $VERSION and commit the pin" >&2
            exit 1
          fi
          url="https://storage.googleapis.com/datensee-templates/v${VERSION}/datensee-pipeline.jar"
          echo "fetching $url"
          curl -fSL --retry 3 -o datensee-pipeline.jar "$url" || {
            echo "::error::no staged JAR at $url — run scripts/release-template.sh $VERSION first" >&2
            exit 1
          }
          echo "${pinned}  datensee-pipeline.jar" | sha256sum -c -
      - name: Attach JAR to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --generate-notes \
                 $([[ "$TAG" == *a* || "$TAG" == *b* || "$TAG" == *rc* ]] && echo --prerelease)
          gh release upload "$TAG" datensee-pipeline.jar --clobber

  pypi:
    runs-on: ubuntu-latest
    needs: [verify, jar]
    environment:
      name: pypi
      url: https://pypi.org/project/datensee/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish dist/*
