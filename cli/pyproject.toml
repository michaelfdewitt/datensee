[project]
name = "gee-df"
version = "0.1.0"
description = "Parallelize Google Earth Engine exports via Cloud Dataflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer[all]>=0.12",
    "pydantic>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "jsonschema>=4.0",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[project.scripts]
gee-df = "gee_df.main:app"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
